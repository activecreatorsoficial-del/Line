name: line
description: Direct, temporary file sharing between Windows and Android.
publish_to: none
version: 0.9.0+14

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.3
  file_picker: ^10.3.10
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.4.0
  basic_utils: ^5.8.2
  pointycastle: ^4.0.0
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
